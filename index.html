  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js"></script>

  <script>
    VANTA.BIRDS({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      backgroundColor: 0x05050f,
      color1: 0x00f0ff,
      color2: 0xbf00ff,
      colorMode: "lerpGradient",
      birdSize: 1.2,
      wingSpan: 28,
      speedLimit: 4.0,
      separation: 60,
      alignment: 50,
      cohesion: 50,
      quantity: 3,
    });
